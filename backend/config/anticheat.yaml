# 反作弊系统配置文件

# 检测维度配置（指标重设计，详见 docs/anticheat/METRICS_REDESIGN.md）
dimensions:
  decision_optimality:
    # 决策最优度：出牌长期接近理论最优（尤其低经验账号）的强作弊指纹
    weight: 0.30
    # 生效所需最小决策数
    threshold: 15
    percentile: 0.99

  think_time:
    # 思考时长异常：复杂局面却几乎零思考（客户端上报+服务端上界校验）
    weight: 0.25
    # 复杂局面思考耗时下限（毫秒），低于视为超人决策
    threshold: 300
    percentile: 0.05

  recent_performance:
    # 近期战绩：近 N 局滑动窗口胜率 + 对手强度（替换旧的全局累计胜率）
    weight: 0.15
    # 窗口胜率阈值（百分比，0-100）
    threshold: 85
    percentile: 0.99

  multi_account:
    # 多开/小号：同 IP/设备指纹聚集（由登录侧信号填充）
    weight: 0.20
    threshold: 0
    percentile: 1.0

# 处罚阈值配置
sanction_thresholds:
  # 观察 (系统标记但不处罚)
  observe_min: 20
  observe_max: 40

  # 警告 (向玩家发送警告)
  warning_min: 40
  warning_max: 60

  # 禁言 (限制聊天功能)
  mute_min: 60
  mute_max: 80

  # 封号 (触发账号封禁)
  ban_min: 80
  ban_max: 100

# 启用的检测策略
enabled_strategies:
  - decision_optimality
  - think_time
  - recent_performance
  - multi_account

# 检测参数微调
detection:
  # 响应时间异常的相对标准差倍数
  response_time_std_multiplier: 2.0

  # 胜率异常的最小样本量
  win_rate_min_games: 10

  # 操作模式异常的最小样本量
  pattern_min_operations: 5

  # 账号新旧程度的额外权重倍数
  new_account_weight_multiplier: 1.5

# 处罚相关配置
sanctions:
  # 禁言时长（分钟）
  mute_duration: 60

  # 封号时长（分钟，-1表示永久）
  ban_duration: 10080  # 7天

  # 处罚有效期检查间隔（分钟）
  check_interval: 60

# 日志相关配置
logging:
  # 是否启用详细日志
  verbose: true

  # 日志级别: debug, info, warn, error
  level: info

# 性能优化
performance:
  # 是否启用缓存
  enable_cache: true

# 解封补偿配置
unban:
  # 是否启用补偿功能
  enabled: true

  # 默认补偿燃素数量
  compensation_amount: 100

  # 默认补偿文案
  default_message: "由于反作弊系统将您误封，在此，ChemistryUNO开发组向受到影响的研究员提供燃素补偿，感谢研究员对维护纯净游戏环境做出的贡献"

  # 补偿消息字符限制
  message_max_length: 500

  # 补偿金额范围
  min_amount: 1
  max_amount: 10000

  # 幂等性缓存TTL（分钟）
  idempotency_ttl: 60


  # 风险评分的缓存时间（秒）
  cache_ttl: 300

  # 批量处理审计日志的大小
  batch_size: 100
