<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>化学UNO - Chemistry UNO</title>
    <style>
      :root {
        color-scheme: light dark;
        --boot-bg:
          radial-gradient(circle at top, rgba(56, 189, 248, 0.24), transparent 42%),
          radial-gradient(circle at bottom, rgba(45, 212, 191, 0.18), transparent 38%),
          linear-gradient(180deg, #f8fbff 0%, #eef6ff 52%, #e7f4f1 100%);
        --boot-bg-dark:
          radial-gradient(circle at top, rgba(34, 211, 238, 0.18), transparent 42%),
          radial-gradient(circle at bottom, rgba(16, 185, 129, 0.16), transparent 38%),
          linear-gradient(180deg, #020617 0%, #0b1120 48%, #071a17 100%);
        --boot-text: #0f172a;
        --boot-text-soft: rgba(15, 23, 42, 0.68);
        --boot-panel: rgba(255, 255, 255, 0.7);
        --boot-panel-border: rgba(148, 163, 184, 0.24);
        --boot-glow: rgba(45, 212, 191, 0.38);
        --boot-core: #14b8a6;
        --boot-core-alt: #38bdf8;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --boot-text: #e2e8f0;
          --boot-text-soft: rgba(226, 232, 240, 0.72);
          --boot-panel: rgba(15, 23, 42, 0.52);
          --boot-panel-border: rgba(148, 163, 184, 0.18);
          --boot-glow: rgba(34, 211, 238, 0.28);
          --boot-core: #2dd4bf;
          --boot-core-alt: #38bdf8;
        }
      }

      html, body {
        margin: 0;
        min-height: var(--app-height, 100vh);
      }

      #app {
        min-height: var(--app-height, 100vh);
      }

      body {
        background: #020617;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--boot-bg);
        color: var(--boot-text);
        transition: opacity 320ms ease, visibility 320ms ease;
      }

      @media (prefers-color-scheme: dark) {
        #boot-splash {
          background: var(--boot-bg-dark);
        }
      }

      body.app-ready #boot-splash {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-shell {
        position: relative;
        display: grid;
        place-items: center;
        gap: 18px;
        min-width: min(88vw, 320px);
        padding: 32px 28px;
        border: 1px solid var(--boot-panel-border);
        border-radius: 28px;
        background: var(--boot-panel);
        backdrop-filter: blur(18px);
        box-shadow:
          0 24px 80px rgba(15, 23, 42, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.32);
        overflow: hidden;
      }

      .boot-shell::before {
        content: "";
        position: absolute;
        inset: auto -20% -45% -20%;
        height: 58%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
        transform: translateX(-120%);
        animation: boot-sheen 2.4s ease-in-out infinite;
      }

      .boot-atom {
        position: relative;
        width: 102px;
        height: 102px;
        display: grid;
        place-items: center;
      }

      .boot-ring {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        border: 2px solid rgba(148, 163, 184, 0.22);
        box-shadow: 0 0 24px var(--boot-glow);
      }

      .boot-ring--a {
        transform: rotate(18deg);
        animation: boot-orbit-a 2.2s linear infinite;
      }

      .boot-ring--b {
        transform: rotate(76deg) scaleX(0.78);
        animation: boot-orbit-b 2.8s linear infinite;
      }

      .boot-ring--c {
        transform: rotate(-42deg) scaleY(0.74);
        animation: boot-orbit-c 3.4s linear infinite;
      }

      .boot-core {
        position: relative;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: radial-gradient(circle at 30% 30%, #ffffff 0%, var(--boot-core-alt) 35%, var(--boot-core) 100%);
        box-shadow:
          0 0 0 10px rgba(20, 184, 166, 0.08),
          0 0 34px rgba(56, 189, 248, 0.45);
        animation: boot-core-pulse 1.8s ease-in-out infinite;
      }

      .boot-core::before,
      .boot-core::after {
        content: "";
        position: absolute;
        border-radius: 999px;
        background: #f8fafc;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      }

      .boot-core::before {
        width: 8px;
        height: 8px;
        top: -18px;
        left: 32px;
        animation: boot-electron-a 1.8s linear infinite;
      }

      .boot-core::after {
        width: 6px;
        height: 6px;
        bottom: -16px;
        right: 30px;
        animation: boot-electron-b 2.1s linear infinite;
      }

      .boot-title {
        font: 700 0.98rem/1.1 "Segoe UI", "PingFang SC", sans-serif;
        letter-spacing: 0.32em;
        text-transform: uppercase;
      }

      .boot-subtitle {
        font: 500 0.78rem/1.5 "Consolas", "SFMono-Regular", monospace;
        letter-spacing: 0.18em;
        color: var(--boot-text-soft);
        text-transform: uppercase;
      }

      .boot-progress {
        position: relative;
        width: min(220px, 64vw);
        height: 4px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(148, 163, 184, 0.2);
      }

      .boot-progress::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, rgba(56, 189, 248, 0), rgba(56, 189, 248, 0.95), rgba(45, 212, 191, 0.92), rgba(56, 189, 248, 0));
        transform: translateX(-100%);
        animation: boot-progress 1.35s ease-in-out infinite;
      }

      @keyframes boot-orbit-a {
        to { transform: rotate(378deg); }
      }

      @keyframes boot-orbit-b {
        to { transform: rotate(-284deg) scaleX(0.78); }
      }

      @keyframes boot-orbit-c {
        to { transform: rotate(318deg) scaleY(0.74); }
      }

      @keyframes boot-core-pulse {
        0%, 100% { transform: scale(0.94); }
        50% { transform: scale(1.08); }
      }

      @keyframes boot-progress {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      @keyframes boot-electron-a {
        0% { transform: translate(0, 0) scale(0.9); opacity: 0.9; }
        50% { transform: translate(-4px, 2px) scale(1.15); opacity: 1; }
        100% { transform: translate(0, 0) scale(0.9); opacity: 0.9; }
      }

      @keyframes boot-electron-b {
        0% { transform: translate(0, 0) scale(0.85); opacity: 0.8; }
        50% { transform: translate(5px, -2px) scale(1.1); opacity: 1; }
        100% { transform: translate(0, 0) scale(0.85); opacity: 0.8; }
      }

      @keyframes boot-sheen {
        0%, 35% { transform: translateX(-120%); }
        65%, 100% { transform: translateX(120%); }
      }
    </style>
    <script type="module">
      (function (c, l, a, r, t, y) {
        const clarityId = import.meta?.env?.VITE_CLARITY_ID;
        if (!clarityId) return;
        c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
        t = l.createElement(r); t.async = 1; t.src = 'https://www.clarity.ms/tag/' + clarityId;
        y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
      })(window, document, 'clarity', 'script');
    </script>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-shell">
        <div class="boot-atom">
          <span class="boot-ring boot-ring--a"></span>
          <span class="boot-ring boot-ring--b"></span>
          <span class="boot-ring boot-ring--c"></span>
          <span class="boot-core"></span>
        </div>
        <div class="boot-title">Chemistry UNO</div>
        <div class="boot-subtitle">Preparing reactive chamber</div>
        <div class="boot-progress"></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
