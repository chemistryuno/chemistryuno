name: Build and Test

on:
  push:
    branches: [ "main", "master", "mendeleef" ]
  pull_request:
    branches: [ "main", "master", "mendeleef" ]
  workflow_dispatch:
jobs:
  build-and-test:
    name: Build & Test Full Stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          pnpm install
          cd frontend && pnpm install

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Full Stack
        run: |
          pnpm run build:frontend
          pnpm -C frontend run copy-dist
          go build -o chemistryuno main.go

      - name: Start backend for Python tests
        run: |
          nohup ./chemistryuno > server.log 2>&1 &
          echo "Backend starting..."
          sleep 10
          
          # Health check - wait for server to be ready
          for i in {1..30}; do
            if curl -s http://localhost:8080/ping > /dev/null 2>&1; then
              echo "✓ Backend is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "✗ Backend failed to start"
              cat server.log
              exit 1
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 1
          done
          
      - name: Test Full Stack
        run: |
          pip install requests
          python test_main.py
