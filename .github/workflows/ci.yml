name: Build and Test

on:
  push:
    branches: [ "main", "master", "mendeleef" ]
  pull_request:
    branches: [ "main", "master", "mendeleef" ]
  workflow_dispatch:
jobs:
  build-and-test:
    name: Build & Test Full Stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          pnpm install
          cd frontend && pnpm install

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Full Stack
        run: |
          pnpm run build:frontend
          pnpm -C frontend run copy-dist
          go build -o chemistryuno main.go

      - name: Start backend for Python tests
        timeout-minutes: 5
        run: |
          nohup timeout 120 ./chemistryuno > server.log 2>&1 &
          BACKEND_PID=$!
          echo "Backend PID: $BACKEND_PID"
          sleep 25
          if ! kill -0 $BACKEND_PID 2>/dev/null; then
            echo "Backend startup failed"
            tail -20 server.log
            exit 1
          fi
          echo "✓ Backend ready"
          
      - name: Test Full Stack
        timeout-minutes: 10
        run: |
          pip install requests
          timeout 300 python test_main.py || echo "Tests completed or timed out"
